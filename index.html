<div class="shell"><aside class="sidebar"><div class="brand"><svg><use href="#shield"/></svg>安心伴</div><nav class="nav" aria-label="主导航"></nav><div class="side-foot">家庭防骗助手</div></aside><div class="workspace"><header class="topbar"><div class="top-title">安心伴 · 家庭防骗助手</div><div class="mobile-brand"><svg><use href="#shield"/></svg>安心伴</div><div class="top-controls"><span class="demo-badge">家庭防骗演示</span><button class="font-toggle" id="fontToggle" aria-pressed="false" onclick="toggleFont()">Aa 大字</button></div></header><main class="content" id="content"></main></div></div>
<div id="overlay" class="modal-backdrop hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()" aria-label="关闭弹窗">×</button></div><div id="modalBody"></div></section></div><div class="toast hidden" id="toast" role="status"></div>
<script>const $=id=>document.getElementById(id);
const icon=(name,size=22)=>`<svg width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#${name}"/></svg>`;
const state={mode:'elder',page:'home',requests:[],sharedCases:[],large:false,topic:'全部',channel:'全部',query:''};
let currentText='',focusReturn=null,callTimer=null,toastTimer=null,requestSequence=0;
let checkDraft='', familyFilter='all';
function incomingPending(){return state.requests.filter(r=>!r.handled&&r.sender!==state.mode);}
function priorityRequest(){return incomingPending()[0]||state.requests.find(r=>!r.handled)||state.requests[0];}
function stepBar(active){return `<div class="steps" aria-label="当前步骤">${['输入内容','查看线索','请家人核实'].map((t,i)=>`<span class="${active===i?'current':''}" ${active===i?'aria-current="step"':''}>${i+1} ${t}</span>`).join('')}</div>`;}

const samples={refund:'您好，我是购物平台客服。您的订单需要退款，请立即打开屏幕共享，提供短信验证码并转账到安全账户完成验证。',delivery:'您的包裹已到达驿站，请凭取件码领取。',unknown:'您好，有一件重要的事情想和您聊聊，请尽快联系我。'};
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function title(h,extra=''){return `<div class="page-heading"><h1>${h}</h1>${extra}</div>`;}
function footer(){return `<footer class="footer"><span>${icon('lock',14)} 仅分享你主动选择的内容</span><span>本地演示 · 刷新后记录清空</span></footer>`;}
function drawNav(){document.querySelector('.nav').innerHTML=[['home','home','首页'],['cases','message','案例'],['family','family','家人']].map(([page,ico,label])=>`<button class="${state.page===page?'active':''}" ${state.page===page?'aria-current="page"':''} onclick="navigate('${page}')">${icon(ico)}${label}</button>`).join('');}
function render(){document.body.classList.toggle('simple-home',state.page==='home');drawNav();$('fontToggle').textContent=state.large?'Aa 标准字':'Aa 大字';$('fontToggle').setAttribute('aria-pressed',state.large);document.body.classList.toggle('large-text',state.large);if(state.page==='home')renderHome();else if(state.page==='cases')renderCases();else renderFamily();}
function navigate(page){state.page=page;render();window.scrollTo({top:0,behavior:'instant'});}
function setMode(mode){state.mode=mode;render();}
function toggleFont(){state.large=!state.large;render();}
function familyCard(){const elder=state.mode==='elder';return `<section class="card"><div class="card-title">${elder?'我的联系人':'我关心的家人'}</div><div class="person"><div class="avatar">${elder?'女':'母'}</div><div><strong>${elder?'女儿':'妈妈'}</strong><small>演示家庭成员</small></div></div><button class="family-button" onclick="navigate('family')">查看家人和记录 →</button></section>`;}
function recentRequest(){if(!state.requests.length)return '';const r=priorityRequest();const status=r.handled?'家人已回应':(r.sender===state.mode?(state.mode==='elder'?'等待女儿回应':'等待妈妈回应'):'等待你回应');return `<section><div class="section-head"><h2>${r.handled?'最近回应':'待跟进的事'}</h2><span class="status ${r.handled?'':'pending'}">${status}</span></div><button class="recent-card" onclick="showRequest(${r.id})">${icon('message',24)}<div style="flex:1;min-width:0"><strong>${escapeHTML(r.text.slice(0,45))}${r.text.length>45?'…':''}</strong><p>${r.handled?'家人：'+escapeHTML(r.reply||'先别操作，我陪你一起核实。'):'查看内容并继续跟进'}</p></div><span>→</span></button></section>`;}
function renderHome(){
  const elder = state.mode === 'elder';
  const latest = priorityRequest();
  let familyHint = elder ? '请家人一起核实' : '看看家里谁需要帮忙';
  if (latest) {
    if (latest.sender !== state.mode && !latest.handled) familyHint = '有求助等你看';
    else if (latest.sender === state.mode) familyHint = latest.handled ? '点开看家人的回复' : '查看我的求助';
  }
  $('content').innerHTML = `<section class="simple-start">
    <h1><svg width="38" height="42" aria-hidden="true"><use href="#shield"/></svg>安心伴</h1>
    <button class="start-action check-action" onclick="openCheck()">
      ${icon('scan',38)}<span><strong>帮我看看</strong><small>看看对方说的话</small></span>
    </button>
    <button class="start-action family-action" onclick="${elder && !latest ? 'openShare()' : "navigate('family')"}">
      ${icon('family',38)}<span><strong>${elder ? '找家人' : '查看求助'}</strong><small>${familyHint}</small></span>
    </button>
  </section>`;
}
function caseRows(list){return `<div class="case-list">${list.map(c=>`<button class="case-row" onclick="openCase('${c.id}')"><span class="row-icon">${icon(c.channel==='电话'?'phone':'message',20)}</span><div class="case-row-main"><h3>${c.title}</h3><p>${c.quote}</p></div><span class="topic">${c.type}</span><span class="row-arrow">›</span></button>`).join('')}</div>`;}
function filteredCases(){return cases.filter(c=>(state.topic==='全部'||caseTopics[c.id].includes(state.topic))&&(state.channel==='全部'||c.channel===state.channel)&&(!state.query||[c.title,c.quote,c.type,...c.dialogue].join(' ').includes(state.query)));}
function renderCases(){const list=filteredCases();$('content').innerHTML=title('防骗案例')+`<label class="label" for="caseSearch">搜索案例</label><input id="caseSearch" type="search" maxlength="100" placeholder="输入退款、补贴、换号码…" value="${escapeHTML(state.query)}" oninput="if(!event.isComposing)searchCases(this.value)" oncompositionend="searchCases(this.value)"><div class="filter-top"><h2>常见套路<span class="case-count">${list.length} 个</span></h2><label class="channel-select" for="channel">渠道 <select id="channel" onchange="changeChannel(this.value)">${['全部','电话','短信','聊天'].map(c=>`<option ${c===state.channel?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="filters" aria-label="情境分类">${['全部','要我转账','要验证码','下载软件','冒充亲友','补贴返利'].map(t=>`<button class="${state.topic===t?'on':''}" aria-pressed="${state.topic===t}" onclick="filterCases('${t}')">${t}</button>`).join('')}</div>${list.length?caseRows(list):`<div class="empty"><strong>这个分类暂时没有案例</strong><p>可以切换渠道，或查看全部。</p><button class="text-button" onclick="resetFilters()">查看全部案例 →</button></div>`}<button class="text-button" onclick="openCall()">看看模拟来电对话 →</button><p class="case-caption">情景示例 · 非真实案件报道</p>`+footer();}
function filterCases(topic){state.topic=topic;renderCases();}
function changeChannel(channel){state.channel=channel;renderCases();$('channel').focus();}
function resetFilters(){state.topic='全部';state.channel='全部';state.query='';renderCases();}
function searchCases(value){const start=$('caseSearch').selectionStart;state.query=value.trim();renderCases();const input=$('caseSearch');input.focus();try{input.setSelectionRange(start,start);}catch{}}
function renderFamily(){const elder=state.mode==='elder';const pending=incomingPending().length;const shown=state.requests.filter(r=>familyFilter==='all'||(familyFilter==='incoming'?!r.handled&&r.sender!==state.mode:!r.handled&&r.sender===state.mode));$('content').innerHTML=title('家人')+`<div class="family-layout"><div><div class="section-head"><h2>求助记录</h2>${elder && state.requests.length ? '<button class="btn light" onclick="openShare()">发起求助</button>' : ''}<span class="status ${pending?'pending':''}">${pending} 条等我回应</span></div><div class="filters family-filters" aria-label="求助分类">${[['all','全部'],['incoming','等我回应'],['sent','等家人回应']].map(([key,label])=>`<button class="${familyFilter===key?'on':''}" aria-pressed="${familyFilter===key}" onclick="familyFilter='${key}';renderFamily()">${label}</button>`).join('')}</div><div class="record-stack">${shown.length?shown.map(r=>`<article class="record"><div class="record-top"><strong>${r.sender===state.mode?(elder?'发给女儿':'发给妈妈'):(elder?'女儿的求助':'妈妈的求助')}</strong><span class="status ${r.handled?'':'pending'}">${r.handled?'已回应':r.sender===state.mode?'等家人回应':'等我回应'}</span></div><p>${escapeHTML(r.text.slice(0,130))}${r.text.length>130?'…':''}</p><button class="text-button" onclick="showRequest(${r.id})">${r.handled?'查看回应':'查看求助'} →</button></article>`).join(''):`<div class="empty"><strong>暂无对应求助</strong><p>可切换分类查看其他记录。</p>${elder?'<button class="text-button" onclick="openShare()">发起求助 →</button>':''}</div>`}</div><section class="family-section"><div class="section-head"><h2>案例分享</h2><span class="case-count">${state.sharedCases.length} 个</span></div>${state.sharedCases.length?state.sharedCases.map(shared=>{const c=cases.find(c=>c.id===shared.id);return `<button class="shared-row" onclick="openCase('${shared.id}')">${icon('message',22)}<div><strong>${c.title}</strong><small>${shared.sender===state.mode?'我分享的':(elder?'女儿分享的':'妈妈分享的')} · 不代表正在遇险</small></div><span>›</span></button>`;}).join(''):`<div class="empty"><p>暂无分享案例</p><button class="text-button" onclick="navigate('cases')">浏览案例 →</button></div>`}</section></div><aside class="rail">${familyCard()}<section class="card"><div class="card-title">演示视角</div><div class="role-switch"><button class="${elder?'on':''}" aria-pressed="${elder}" onclick="setMode('elder')">长辈</button><button class="${!elder?'on':''}" aria-pressed="${!elder}" onclick="setMode('family')">家人</button></div><p class="mini-note">切换查看同一组模拟记录。不会发送真实通知。</p></section></aside></div>`+footer();}
function openModal(title,body){clearTimeout(voicePoll);clearInterval(callTimer);callTimer=null;if($('overlay').classList.contains('hidden'))focusReturn=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('overlay').classList.remove('hidden');document.querySelector('.workspace').inert=true;document.querySelector('.sidebar').inert=true;document.body.style.overflow='hidden';document.querySelector('.modal').scrollTop=0;document.querySelector('.close').focus();}
function closeModal(){document.querySelectorAll('#modalBody audio').forEach(audio=>audio.pause());clearTimeout(voicePoll);if($('messageInput'))checkDraft=$('messageInput').value;clearInterval(callTimer);callTimer=null;$('overlay').classList.add('hidden');document.querySelector('.workspace').inert=false;document.querySelector('.sidebar').inert=false;document.body.style.overflow='';if(focusReturn&&focusReturn.isConnected)focusReturn.focus();}
let voicePoll;
function openCheck(sample){openModal('帮我看看',`${stepBar(0)}<label for="messageInput" class="label">对方是怎么说的？</label><textarea id="messageInput" maxlength="3000" placeholder="粘贴消息，或写下电话里听到的一句话…">${escapeHTML(sample?samples[sample]:checkDraft)}</textarea><div class="chips"><button onclick="$('messageInput').value=samples.refund">退款示例</button><button onclick="$('messageInput').value=samples.delivery">快递示例</button></div><p class="error hidden" id="inputError" role="alert">请先填写要检查的内容。</p><button class="btn full" onclick="analyze()">检查这条消息</button><p class="notice">本地关键词演示，未连接 AI。文字不会上传。</p><button class="text-button" onclick="closeModal();navigate('cases')">看看防骗案例 →</button><div id="voiceEntry"></div>`);offerVoice();}
async function offerVoice(){
  const entry = $('voiceEntry');
  if (!entry || !['localhost','127.0.0.1'].includes(location.hostname)) return;
  try {
    const data = await readCall();
    if (entry.isConnected && data.phase) entry.innerHTML = '<button class="btn outline full" onclick="openVoice()">查看代接记录</button>';
  } catch {}
}
async function readCall(){
  const response = await fetch('/voice/status', {cache:'no-store'});
  if (!response.ok) throw Error('unavailable');
  return response.json();
}
function openVoice(){
  if ($('messageInput')) checkDraft = $('messageInput').value;
  openModal('电话代接', '<p class="notice">本机测试线路 · 最近一通来电</p><h3 id="voiceTitle" role="status">正在连接…</h3><p class="share-content" id="voiceText"></p><p class="advice hidden" id="voiceWarning" role="status"></p><p><a class="text-button" href="/try">我来试打一通 →</a></p><details class="original call-examples"><summary>试听两通测试来电</summary><p>以下录音使用合成来电语音。</p><label>索要验证码<audio controls preload="none" src="/voice/examples/refund.mp3"></audio></label><label>快递通知<audio controls preload="none" src="/voice/examples/parcel.mp3"></audio></label></details><button class="btn full" onclick="openCheck()">返回帮我看看</button>');
  const title = $('voiceTitle');
  async function refresh(){
    try {
      const call = await readCall();
      if (!title.isConnected || $('overlay').classList.contains('hidden')) return;
      title.textContent = {idle:'等待来电',active:call.dialogue?'安心伴正在代接':'正在接收语音',ended:'通话已结束',failed:'语音连接中断'}[call.phase];
      $('voiceText').style.whiteSpace = 'pre-line';
      $('voiceText').textContent = call.dialogue || call.text || (call.phase==='idle' ? '当前没有接入的通话。' : '暂时没有听清的话。');
      const clue = voiceRisk(call.text);
      $('voiceWarning').textContent = clue;
      $('voiceWarning').classList.toggle('hidden', !clue);
    } catch {
      if (!title.isConnected || $('overlay').classList.contains('hidden')) return;
      title.textContent = '连接中断，正在重试';
    }
    voicePoll = setTimeout(refresh, 1000);
  }
  refresh();
}
function voiceRisk(text){
  if (/验证码|驗證碼|短信[验驗][证證][马馬]/.test(text)) return '可能听到对方提了验证码。请把收到的验证码留给自己。';
  if (/转账|轉賬|轉帳|汇款|匯款|安全账[户戶]|安全帳戶/.test(text)) return '通话中提到钱款。先暂停付款，找家人一起核实。';
  if (/屏幕共享|共享屏幕|螢幕共享|共享螢幕/.test(text)) return '通话中提到共享屏幕。先不要开启。';
  return '';
}
function analyze(){currentText=$('messageInput').value.trim();checkDraft=currentText;if(!currentText){$('inputError').classList.remove('hidden');$('messageInput').focus();return;}showResult();}
function showResult(){const rules=[[/验证码/,'提到了验证码，需要核实是否在索取。'],[/屏幕共享|共享屏幕/,'屏幕共享可能暴露账户及验证信息。'],[/安全账户/,'要求转入“安全账户”，需要高度警惕。'],[/转账|汇款|打款/,'涉及付款，先核实收款对象和原因。'],[/下载.*软件|下载.*App/i,'要求下载软件，先核实来源与用途。'],[/立即|马上|尽快/,'催促立刻行动，可能影响判断。']];const matches=rules.filter(([r])=>r.test(currentText)).map(([,s])=>s);openModal('检查结果',`${stepBar(1)}<details class="original"><summary>查看原始消息</summary><p>${escapeHTML(currentText)}</p></details><div class="result-banner ${matches.length?'':'neutral'}"><span>${matches.length?'有风险线索':'信息不足'}</span><h3>${matches.length?'先暂停操作，核实对方身份。':'暂时无法判断是否可信。'}</h3><p>${matches.length?'不要仅按这条消息提供信息或付款。':'未命中演示规则，不代表安全。'}</p></div>${matches.length?`<strong>需要留心的地方</strong><ul class="result-list">${matches.map(m=>`<li>${m}</li>`).join('')}</ul>`:''}<div class="btn-row"><button class="btn" onclick="openShare(currentText)">请家人核实</button><button class="btn light" onclick="openCheck()">返回修改</button></div><p class="notice">结果来自关键词规则，仅演示流程，不是事实核查结论。</p>`);}
function openShare(text='',caseId=null){const c=cases.find(c=>c.id===caseId);openModal('请家人核实',`${stepBar(2)}<div class="person"><div class="avatar">${state.mode==='elder'?'女':'母'}</div><div><strong>${state.mode==='elder'?'女儿':'妈妈'}</strong><small>演示联系人</small></div></div>${c?`<p class="context-note" style="margin-top:18px">参考案例：${c.title}</p>`:''}<label class="label" for="shareText">${c?'填写你实际遇到的情况':'发生了什么？'}</label><textarea id="shareText" maxlength="3000" placeholder="写下实际情况，或粘贴对方的消息…">${escapeHTML(text)}</textarea><p id="shareError" class="error hidden" role="alert">请先填写实际情况，再发起求助。</p><button class="btn full" style="margin-top:17px" onclick="sendRequest()">确认求助 · 演示</button><p class="notice">本地演示，家人不会收到通知。</p><button class="text-button" onclick="closeModal();navigate('family')">家人和求助记录 →</button>`);}
function sendRequest(){const text=$('shareText').value.trim();if(!text){$('shareError').classList.remove('hidden');$('shareText').focus();return;}state.requests.unshift({id:++requestSequence,text,handled:false,sender:state.mode});render();openModal('已添加求助 · 演示',`<div class="success-symbol">✓</div><h3 class="center">等待家人回应</h3><div class="btn-row"><button class="btn" onclick="closeModal();navigate('home')">回到首页</button><button class="btn light" onclick="closeModal();state.mode='${state.mode==='elder'?'family':'elder'}';navigate('family')">查看对方视角</button></div><p class="notice">记录仅保存在本页，没有对外发送消息。</p>`);}
function showRequest(id){const r=state.requests.find(r=>r.id===id);if(!r)return;const canReply=state.mode!==r.sender;openModal('求助详情',`<div class="record-top"><strong>求助内容</strong><span class="status ${r.handled?'':'pending'}">${r.handled?'已回应':canReply?'等我回应':'等家人回应'}</span></div><div class="share-content">${escapeHTML(r.text)}</div>${r.handled?`<div class="reply-card"><strong>家人回应</strong><p>${escapeHTML(r.reply||'先别操作，我陪你一起核实。')}</p><small>已回应不代表已确认安全</small></div>`:''}${canReply?`<label class="label" for="replyText">${r.handled?'更新回应':'给家人一句具体的回应'}</label><textarea id="replyText" maxlength="1000" placeholder="例如：先别转账，我打电话和你一起核实。">${escapeHTML(r.reply||'')}</textarea><div class="chips"><button onclick="$('replyText').value='先别操作，我打电话和你一起核实。'">先别操作</button><button onclick="$('replyText').value='请先通过官方渠道核实，我陪你一起查。'">一起核实</button></div><p id="replyError" class="error hidden" role="alert">请填写回应内容。</p><button class="btn full" onclick="respond(${r.id})">${r.handled?'更新回应':'确认回应'} · 演示</button>`:'<p class="notice">本页模拟家人协作，不会发送真实通知。</p>'}`);}
function respond(id){const r=state.requests.find(r=>r.id===id);if(!r||r.sender===state.mode)return;const reply=$('replyText').value.trim();if(!reply){$('replyError').classList.remove('hidden');$('replyText').focus();return;}r.reply=reply;r.handled=true;closeModal();render();toast('已记录回应 · 演示');}
function openCase(id){const c=cases.find(c=>c.id===id);if(!c)return;openModal(c.title,`<div class="case-detail-label">${icon(c.channel==='电话'?'phone':'message',17)} ${c.channel} · ${c.type} · 情景示例</div><div class="case-conversation">${c.dialogue.map(t=>`<div class="bubble"><small>对方话术</small>${t}</div>`).join('')}</div><strong>风险点</strong><ul class="detail-points">${c.risks.map(t=>`<li>${t}</li>`).join('')}</ul><div class="advice"><strong>建议处理</strong>${c.action}</div><div class="case-buttons"><button class="btn outline" onclick="shareCase('${id}')">发给家人看看</button><button class="btn" onclick="openShare('', '${id}')">我遇到了类似情况</button></div>`);}
function shareCase(id){const c=cases.find(c=>c.id===id);openModal('分享案例',`<div class="person"><div class="avatar">${state.mode==='elder'?'女':'母'}</div><div><strong>${state.mode==='elder'?'发给女儿':'发给妈妈'}</strong><small>演示联系人</small></div></div><div class="share-content" style="margin-top:20px"><strong>${c.title}</strong><br>${c.quote}</div><p style="margin-top:16px">这是一条防骗案例提醒，不会创建求助。</p><button class="btn full" style="margin-top:20px" onclick="confirmCaseShare('${id}')">确认分享案例 · 演示</button><p class="notice">只更新本页的案例分享记录，不发送真实通知。</p>`);}
function confirmCaseShare(id){if(!state.sharedCases.some(c=>c.id===id&&c.sender===state.mode))state.sharedCases.unshift({id,sender:state.mode});closeModal();render();toast('案例已加入分享记录，未创建求助');}
function openCall(){openModal('AI 代接 · 文字演示',`<div class="call-status"><span>模拟来电：自称客服</span><span id="callState">等待开始</span></div><div class="transcript" id="transcript"><p class="center" style="padding:30px 10px">客服退款情景</p></div><button class="btn full" style="margin-top:20px" id="callButton" onclick="startCall()">播放演示</button><p class="notice">预设剧本，不会拨号或接听电话。</p>`);}
function startCall(){const lines=[['对方','您好，我是平台客服，您的订单要退款。'],['安心伴','请先说明是哪笔订单，我们会通过官方渠道核实。'],['对方','需要马上打开屏幕共享，再告诉我验证码。'],['安心伴','我们不会提供验证码或开启屏幕共享。请说明可在官方 App 内查询的信息。'],['风险提示','出现索要验证码、要求屏幕共享的风险线索。建议结束通话，再请家人核实。']];let n=0;$('transcript').innerHTML='';$('callState').textContent='演示中';$('callButton').textContent='停止';$('callButton').onclick=()=>stopCall(false);const next=()=>{if(n>=lines.length){stopCall(true);return;}const [who,text]=lines[n++];const el=document.createElement('div');el.className='bubble'+(who==='对方'?'':' ai');el.innerHTML=`<small>${who}</small>${text}`;$('transcript').appendChild(el);el.scrollIntoView({block:'nearest',behavior:'smooth'});};next();callTimer=setInterval(next,1500);}
function stopCall(done=false){clearInterval(callTimer);callTimer=null;if(!$('callState'))return;$('callState').textContent=done?'演示结束':'已停止';$('callButton').textContent='重新播放';$('callButton').onclick=startCall;}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4000);}

$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal();});
