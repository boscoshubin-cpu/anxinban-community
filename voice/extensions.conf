; Send trusted inbound trunk calls to anxinban-in,s,1.
; Set ANXINBAN_FAMILY_DIAL to the parent's existing extension (e.g. PJSIP/parent).
; Add known numbers under the anxinban-contacts family of AstDB.
[anxinban-in]
exten => s,1,Set(ANX_NUMBER=${CALLERID(num)})
 same => n,GotoIf($["${ANX_NUMBER}" = ""]?assistant)
 same => n,GotoIf($[${REGEX("^([+]86|0086)?[0-9]+$" ${ANX_NUMBER})} = 0]?assistant)
 same => n,ExecIf($["${ANX_NUMBER:0:3}" = "+86"]?Set(ANX_NUMBER=${ANX_NUMBER:3}))
 same => n,ExecIf($["${ANX_NUMBER:0:4}" = "0086"]?Set(ANX_NUMBER=${ANX_NUMBER:4}))
 same => n,GotoIf($[${DB_EXISTS(anxinban-contacts/${ANX_NUMBER})}]?family:assistant)
 same => n(family),Dial(${ANXINBAN_FAMILY_DIAL},30)
 same => n,Hangup()
 same => n(assistant),Answer()
 same => n,AudioSocket(${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')},127.0.0.1:9093)
 same => n,Hangup()
